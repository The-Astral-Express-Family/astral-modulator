# 镜像构建与发布（semver tag 驱动）。
# 触发矩阵（与 .github/workflows/ci.yml 的三道质量门互补）：
#   PR            → 只验证镜像能否构建，不推送；
#   push 到 main  → 推滚动 dev + dev-<短sha> 开发镜像；
#   push v*.*.*   → 校验 semver 后推 1.2.3 / 1.2 / 1 / latest
#                    （预发布 -rc.1 只推完整版本号，不动移动标签与 latest），
#                    并自动创建 GitHub Release（自动生成变更日志）。
name: docker

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # GHCR 要求镜像名全小写（仓库 owner 含大写字母）。
  IMAGE: ghcr.io/the-astral-express-family/astral-modulator

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      # tag 触发时创建 GitHub Release 需要 contents: write；
      # main 推镜像需要 packages: write。PR 时两者皆用不到。
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 仅 push 事件登录；PR 不登录也不推送。
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 严格 semver 校验：v1.2.3 / v1.2.3-rc.1 合法；
      # v1.2、v1.x、v01.2.3 等脏 tag 在此拦截，给出明确报错。
      # （v1.2 这类两段式 tag 不会命中上方 tags: ['v*.*.*'] 过滤器，
      # 此步骤拦截的是形如 v1.0.x / v1.2.3- 的伪 semver。）
      - name: Validate semver tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::tag '$TAG' 不是合法 semver（期望 vMAJOR.MINOR.PATCH[-prerelease]，如 v1.2.3 / v1.2.3-rc.1）"
            exit 1
          fi

      # 标签生成：
      #   tag 触发   → 1.2.3 / 1.2 / 1（prerelease 时全部解析为完整版本号，
      #                如 2.0.8-beta.67，不会产生移动标签）
      #                + latest（flavor latest=auto：prerelease 不打 latest，
      #                raw/sha 类型不打 latest，dev 不会污染 latest）
      #   main 触发  → dev（滚动）+ dev-<短sha>（可回溯）
      #   PR 触发    → pr-N（仅本地标记，不推送）
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=dev-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # tag 触发时自动创建 GitHub Release；prerelease tag 自动标记为预发布。
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
