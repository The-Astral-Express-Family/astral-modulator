# CI：服务端 + Web + 协议契约三道门。
# CLI 的三平台构建/发布在 astral-cli 仓库；本仓库只负责协议事实来源的质量。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      # TODO(phase-2): 起 PostgreSQL service 跑集成测试（goose up + task claim 并发用例）。

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: lint openapi
        run: npx --yes @redocly/cli@1.34.2 lint
      # TODO(phase-2): 错误码/事件类型双源一致性检查
      #   （openapi.yaml enum vs server/internal/httpx/errors.go vs api/schemas/*.json）。
      # TODO(phase-3): 从 openapi 生成 web/src/api/types（openapi-typescript），删除手写版。
