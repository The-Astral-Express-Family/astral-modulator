# CI：服务端 + Web + 协议契约三道门。
# CLI 的三平台构建/发布在 astral-cli 仓库；本仓库只负责协议事实来源的质量。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: astral
          POSTGRES_PASSWORD: astral
          POSTGRES_DB: astral
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U astral -d astral"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: unit tests
        run: go test ./... -count=1
      - name: postgres migration test
        env:
          ASTRAL_TEST_POSTGRES_DSN: postgres://astral:astral@localhost:5433/astral?sslmode=disable
        run: go test ./tests/... -count=1 -v

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run gen:api
      # 契约漂移门：lockfile 安装的 openapi-typescript 版本重新生成的类型
      # 必须与库中提交的 src/api/schema.d.ts 逐字节一致（改 openapi.yaml 后
      # 忘跑 gen:api 或本地版本不同，在此失败）。
      - name: schema.d.ts drift gate
        run: git diff --exit-code src/api/schema.d.ts
      - run: npm run build

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: lint openapi
        run: npx --yes @redocly/cli@1.34.2 lint
      # 错误码/事件类型双源一致性检查已由 server 契约门落地（server job 的
      # go test ./... 覆盖，均以 openapi.yaml / api/schemas 为基准双向比对）：
      #   - TestOpenapiErrorCodesMatchHttpx：openapi ErrorCode enum ↔ httpx/errors.go；
      #   - TestEventTypesSync：outbox/types.go ↔ api/schemas/event.json ↔ web/src/api/sse.ts。
      # web 类型生成契约门见 web job 的 schema.d.ts drift gate。
  image:
    needs:
      - server
      - web
      - openapi

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # PR 只验证镜像能否成功构建，不发布。
      # merge/push 到 main 后才登录 GHCR。
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Containerfile

          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

          tags: |
            ghcr.io/the-astral-express-family/astral-modulator:main
            ghcr.io/the-astral-express-family/astral-modulator:sha-${{ github.sha }}

          build-args: |
            VERSION=sha-${{ github.sha }}
            VCS_REF=${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
